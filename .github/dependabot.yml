version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*"] }
      npm: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/backend, /frontend, /latex-worker]
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
