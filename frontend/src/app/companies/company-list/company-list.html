<div class="header">
  <h2>Companies</h2>
  <a class="button" routerLink="new">+ New Company</a>
</div>

@if (loading()) {
  <p>Loading…</p>
} @else if (companies().length === 0) {
  <p>No companies yet.</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Industry</th>
        <th>Growth</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (company of companies(); track company.id) {
        <tr>
          <td>{{ company.name }}</td>
          <td>{{ company.industry || '—' }}</td>
          <td>{{ company.growth_trajectory || '—' }}</td>
          <td class="actions">
            <a [routerLink]="[company.id, 'edit']">Edit</a>
            <button type="button" (click)="remove(company.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
