<div class="board-header">
  <h2>Interview Pipeline</h2>
  @if (error()) {
    <span class="error">{{ error() }}</span>
  }
</div>

@if (loading()) {
  <p>Loading…</p>
} @else {
  <div class="board">
    @for (stage of stages; track stage) {
      <app-kanban-column
        [stage]="stage"
        [applications]="columns()[stage]"
        [connectedStageIds]="stages"
        (dropped)="onDrop($event.event, $event.targetStage)"
      />
    }
  </div>
}
