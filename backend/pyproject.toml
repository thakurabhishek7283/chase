[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Chase backend: ATS scoring, template-preserving LaTeX resume tailoring and semantic job matching"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    # Gemini is the only reasoning model this app talks to (app/ai/provider.py),
    # so only the `google` extra — its SDK — is installed.
    "pydantic-ai-slim[google]>=2.21.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.0",
]

[project.optional-dependencies]
# Local, key-free embeddings. Kept optional because it pulls an ONNX runtime
# and model weights that only the "local" embedding provider needs.
local-embeddings = [
    "fastembed>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    # Starlette renamed the 422 constant; FastAPI's own internals still use the
    # old one. Our code does not — see app/routers.
    "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "ASYNC",   # blocking calls inside async code
    "S",       # bandit (security)
    "SIM",     # simplifications
    "RUF",
]
ignore = [
    "E501",    # the formatter owns line length; long strings and URLs are fine
    "B008",    # FastAPI's Depends()/Query() defaults are the idiom
    "SIM108",  # a ternary is not always clearer than an if/else
    "UP042",   # (str, Enum) -> StrEnum changes str() output; not worth the risk
    "UP047",   # TypeVar generics read fine; PEP 695 syntax is optional
    "RUF001", "RUF002", "RUF003",  # typographic dashes and quotes in prose are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts and fixture passwords
"app/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
