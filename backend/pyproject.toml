[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    # Gemini is the only reasoning model this app talks to (app/ai/provider.py),
    # so only the `google` extra — its SDK — is installed.
    "pydantic-ai-slim[google]>=2.21.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.0",
]

[project.optional-dependencies]
# Local, key-free embeddings. Kept optional because it pulls an ONNX runtime
# and model weights that only the "local" embedding provider needs.
local-embeddings = [
    "fastembed>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
